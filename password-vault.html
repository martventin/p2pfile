<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted Password Vault - UtilityPro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker Registered!', reg))
                .catch(err => console.error('Service Worker Registration Failed!', err));
            });
        }
    </script>
</head>
<body>

   <div id="sidebar-container"></div>
    <script src="sidebar.js"></script>
    <script src="config.js"></script>
    <script src="p2p-client.js"></script>
    <script src="db-api.js"></script>

    <main class="main-content">
        <header>
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <div style="font-weight: 600; font-size: 1.2rem; display: none;" class="desktop-title">Local Encrypted Vault</div>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>
                <div style="font-weight: 500;">👋 Admin</div>
            </div>
        </header>

        <section class="dashboard-content">
            
            <div class="card lock-screen" id="lock-screen">
                <h2 style="margin-bottom: 10px;">🔐 Unlock Your Vault</h2>
                <p style="margin-bottom: 20px; font-size: 0.9rem; opacity: 0.8;">Enter a Master Password to encrypt/decrypt your data.</p>
                <div style="max-width: 400px; margin: 0 auto; display: flex; gap: 10px; flex-direction: column;">
                    <input type="password" id="master-password" placeholder="Enter Master Password..." style="margin-bottom: 0;">
                    <button class="btn" onclick="unlockVault()">Unlock / Set</button>
                </div>
            </div>

            <div id="workspace" style="display: none;">
                
                <div class="row">
                    <div class="card" style="flex: 1;">
                        <div class="card-header">1. Generate Strong Password</div>
                        <input type="text" id="gen-output" readonly placeholder="Click generate..." style="font-size: 1.2rem; text-align: center; color: var(--success-color);">
                        
                        <div class="row" style="margin-top: 15px;">
                            <div style="flex: 1;">
                                <label style="font-size: 0.85rem; display: block; margin-bottom: 5px;">Length: <span id="len-val">16</span></label>
                                <input type="range" id="gen-length" min="8" max="64" value="16" oninput="document.getElementById('len-val').innerText = this.value" style="width: 100%;">
                            </div>
                        </div>
                        
                        <div class="row" style="font-size: 0.85rem; flex-direction: row; flex-wrap: wrap;">
                            <label><input type="checkbox" id="gen-num" checked> Numbers</label>
                            <label><input type="checkbox" id="gen-sym" checked> Symbols</label>
                            <label><input type="checkbox" id="gen-up" checked> Uppercase</label>
                        </div>
                        
                        <div class="row" style="margin-top: 15px; flex-direction: row;">
                            <button class="btn outline" style="flex: 1;" onclick="generatePassword()">🔄 Generate</button>
                            <button class="btn" style="flex: 1;" onclick="copyToClipboard('gen-output', null, this)">📋 Copy</button>
                        </div>
                    </div>

                    <div class="card" style="flex: 1;">
                        <div class="card-header">2. Save to Vault</div>
                        <label style="font-size: 0.85rem;">Platform / URL</label>
                        <input type="text" id="save-app" placeholder="e.g., https://netflix.com">
                        
                        <label style="font-size: 0.85rem;">Username / Email</label>
                        <input type="text" id="save-user" placeholder="e.g., admin@example.com">
                        
                        <label style="font-size: 0.85rem;">Password</label>
                        <div class="row" style="gap: 5px; flex-direction: row;">
                            <input type="text" id="save-pass" placeholder="Paste or type password..." style="margin-bottom: 0;">
                            <button class="btn outline" style="padding: 12px;" onclick="document.getElementById('save-pass').value = document.getElementById('gen-output').value" title="Pull from Generator">📥</button>
                        </div>

                        <button class="btn success" style="width: 100%; margin-top: 15px;" onclick="saveToVault()">💾 Encrypt & Save</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span>🏦 Your Saved Passwords</span>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <input type="file" id="import-file" accept=".json,application/json" style="width: 0; height: 0; position: absolute; overflow: hidden;" onchange="importVault(this)">
                            
                            <button class="btn outline" style="padding: 8px 15px; font-size: 0.85rem;" onclick="document.getElementById('import-file').click()">📂 Import Secure Vault</button>
                            <button class="btn outline" style="padding: 8px 15px; font-size: 0.85rem;" onclick="exportVault()">💾 Backup Secure Vault</button>
                            <button class="btn warning" style="padding: 8px 15px; font-size: 0.85rem; border: none;" onclick="exportForBrowserCSV()">🌐 Export to Firefox (CSV)</button>
                            <button class="btn danger" style="padding: 8px 15px; font-size: 0.85rem;" onclick="lockVault()">🔒 Lock</button>
                        </div>
                    </div>
                    
                    <div style="overflow-x: auto;">
                        <table class="vault-table">
                            <thead><tr><th>URL/Platform</th><th>Username</th><th>Password</th><th>Actions</th></tr></thead>
                            <tbody id="vault-list">
                                </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script>
        // --- Mobile Sidebar Toggle ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('mobile-overlay').classList.toggle('active');
        }

        window.onload = function() {
            if(window.innerWidth > 768) {
                const title = document.querySelector('.desktop-title');
                if(title) title.style.display = 'block';
            }
        }

        let currentMasterKey = "";
        let decryptedVault = [];

        // --- Dark Mode Sync ---
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('theme-btn').innerText = '☀️';
        }

        // --- 1. Unlock / Security Logic ---
        function unlockVault() {
            const passInput = document.getElementById('master-password').value;
            if(!passInput) return alert("Enter a master password.");
            
            currentMasterKey = passInput;
            const encryptedData = localStorage.getItem('utility_vault');

            if (encryptedData) {
                try {
                    const bytes = CryptoJS.AES.decrypt(encryptedData, currentMasterKey);
                    const decryptedString = bytes.toString(CryptoJS.enc.Utf8);
                    if(!decryptedString) throw new Error("Wrong password");
                    decryptedVault = JSON.parse(decryptedString);
                } catch (e) {
                    currentMasterKey = ""; 
                    return alert("Incorrect Master Password! Cannot decrypt data.");
                }
            } else {
                decryptedVault = [];
            }

            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('workspace').style.display = 'block';
            document.getElementById('master-password').value = "";
            renderVault();
        }

        function lockVault() {
            currentMasterKey = "";
            decryptedVault = [];
            document.getElementById('lock-screen').style.display = 'block';
            document.getElementById('workspace').style.display = 'none';
            document.getElementById('vault-list').innerHTML = "";
        }

        function syncEncryptedStorage() {
            const ciphertext = CryptoJS.AES.encrypt(JSON.stringify(decryptedVault), currentMasterKey).toString();
            localStorage.setItem('utility_vault', ciphertext);
        }

        // --- 2. Generator Logic ---
        function generatePassword() {
            const len = parseInt(document.getElementById('gen-length').value);
            const useNum = document.getElementById('gen-num').checked;
            const useSym = document.getElementById('gen-sym').checked;
            const useUp = document.getElementById('gen-up').checked;

            let chars = "abcdefghijklmnopqrstuvwxyz";
            if(useUp) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if(useNum) chars += "0123456789";
            if(useSym) chars += "!@#$%^&*()_+~`|}{[]:;?><,./-=";

            let password = "";
            const array = new Uint32Array(len);
            window.crypto.getRandomValues(array);
            for(let i = 0; i < len; i++) { password += chars[array[i] % chars.length]; }

            document.getElementById('gen-output').value = password;
        }

        function copyToClipboard(elementId, customText = null, btnElement = null) {
            const textToCopy = customText || document.getElementById(elementId).value;
            if(!textToCopy) return;
            
            navigator.clipboard.writeText(textToCopy).then(() => { 
                if (btnElement) {
                    const originalText = btnElement.innerText;
                    btnElement.innerText = "Copied!";
                    setTimeout(() => btnElement.innerText = originalText, 1500);
                } else {
                    alert("Password Copied!"); 
                }
            });
        }

        // --- 3. Save & Render Logic ---
        function saveToVault() {
            const app = document.getElementById('save-app').value;
            const user = document.getElementById('save-user').value;
            const pass = document.getElementById('save-pass').value;

            if(!app || !pass) return alert("URL/Platform and Password are required!");

            decryptedVault.push({
                id: Date.now(),
                app: app,
                user: user || "N/A",
                pass: pass
            });

            syncEncryptedStorage(); 
            renderVault(); 
            
            document.getElementById('save-app').value = "";
            document.getElementById('save-user').value = "";
            document.getElementById('save-pass').value = "";
        }

        function deleteEntry(id) {
            if(confirm("Delete this saved password?")) {
                decryptedVault = decryptedVault.filter(entry => entry.id !== id);
                syncEncryptedStorage();
                renderVault();
            }
        }

        function renderVault() {
            const tbody = document.getElementById('vault-list');
            tbody.innerHTML = "";

            if(decryptedVault.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; opacity: 0.6;">Vault is empty.</td></tr>`;
                return;
            }

            decryptedVault.forEach(entry => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight: 600; color: var(--primary-color); word-break: break-all;">${entry.app}</td>
                    <td style="word-break: break-all;">${entry.user}</td>
                    <td class="hidden-password">••••••••••••</td>
                    <td style="min-width: 140px;">
                        <button class="btn outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="copyToClipboard(null, '${entry.pass.replace(/'/g, "\\'")}', this)">Copy</button>
                        <button class="btn danger" style="padding: 6px 12px; font-size: 0.8rem; margin-left: 5px;" onclick="deleteEntry(${entry.id})">X</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // --- 4. SECURE JSON BACKUP LOGIC (For this app) ---
        function exportVault() {
            if(decryptedVault.length === 0) return alert("Vault is empty.");
            const ciphertext = CryptoJS.AES.encrypt(JSON.stringify(decryptedVault), currentMasterKey).toString();
            const backup = { type: "UtilityPro_Encrypted_Vault", timestamp: new Date().toISOString(), data: ciphertext };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `secure_vault_backup_${new Date().getTime()}.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importVault(inputElement) {
            const file = inputElement.files[0];
            inputElement.value = ""; // Firefox fix
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedJSON = JSON.parse(e.target.result);
                    if (importedJSON.type !== "UtilityPro_Encrypted_Vault") throw new Error("Invalid Vault File format.");

                    const bytes = CryptoJS.AES.decrypt(importedJSON.data, currentMasterKey);
                    const decryptedString = bytes.toString(CryptoJS.enc.Utf8);
                    if(!decryptedString) return alert("ERROR: Master Password does not match backup file!");

                    decryptedVault = JSON.parse(decryptedString); 
                    syncEncryptedStorage();
                    renderVault();
                    alert("Vault imported successfully!");
                } catch (error) { alert("Failed to read file: " + error.message); }
            };
            
            reader.onerror = function() { alert("Error: Your browser blocked reading this file."); };
            reader.readAsText(file);
        }

        // --- 5. BROWSER CSV EXPORT LOGIC (For Firefox/Chrome) ---
        function exportForBrowserCSV() {
            if(decryptedVault.length === 0) return alert("Vault is empty.");

            let csvContent = "url,username,password\n";

            decryptedVault.forEach(entry => {
                let safeUrl = `"${entry.app.replace(/"/g, '""')}"`;
                let safeUser = `"${entry.user.replace(/"/g, '""')}"`;
                let safePass = `"${entry.pass.replace(/"/g, '""')}"`;

                csvContent += `${safeUrl},${safeUser},${safePass}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "firefox_passwords_import.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            alert("CSV Exported! You can now import this file into Firefox.\n\n⚠️ IMPORTANT: Please permanently delete the CSV file after importing, as your passwords are not encrypted inside it!");
        }
    </script>
</body>
</html>
