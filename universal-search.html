<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Search - UtilityPro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .search-box-container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid #ddd;
        }

        .universal-search-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        .universal-search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .results-grid {
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }

        .result-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            border-color: var(--primary-color);
        }

        .dark-mode .result-card {
            background: #2a2a2a;
            border-color: #444;
        }

        .dark-mode .result-card:hover {
            border-color: var(--primary-color);
        }

        .result-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .result-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        .result-desc {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-bottom: 10px;
        }

        .result-badge {
            font-size: 0.65rem;
            font-weight: 700;
            background: var(--primary-color);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .result-badge.service {
            background: #4caf50;
        }

        .result-badge.action {
            background: #ff9800;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.6;
        }

        .no-results-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .no-results h2 {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
        }

        .search-stats {
            margin-top: 15px;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .search-box-container {
                padding: 20px;
            }

            .results-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <header>
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <div style="font-weight: 600; font-size: 1.2rem;" class="desktop-title">Universal Search</div>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>
                <div style="font-weight: 500;">👋 Admin</div>
            </div>
        </header>

        <section class="dashboard-content">
            <div style="margin-bottom: 30px;">
                <h1 style="margin-bottom: 5px; font-size: 1.8rem;">🔍 Universal Search</h1>
                <p style="opacity: 0.8;">Search all services, pages, and features in one place</p>
            </div>

            <div class="search-box-container">
                <input 
                    type="text" 
                    id="universal-search-input" 
                    class="universal-search-input" 
                    placeholder="Search services, pages, tools... (e.g., 'Aadhar', 'Banking', 'Receipt')"
                    autocomplete="off"
                    autofocus
                >
                <div class="search-stats">
                    <span id="search-count"></span>
                </div>
            </div>

            <div class="tools-grid results-grid" id="search-results-container"></div>
        </section>
    </main>

    <script src="sidebar.js"></script>
    <script src="config.js"></script>
    <script src="p2p-client.js"></script>
    <script src="db-api.js"></script>
    <script>
        const allPages = [
            { name: "Home", url: "index.html", icon: "🏠", desc: "Main dashboard", type: "page" },
            { name: "Services Hub", url: "services.html", icon: "🛠️", desc: "All utility services", type: "page" },
            { name: "Digital Links", url: "links.html", icon: "🔗", desc: "Government & Banking links", type: "page" },
            { name: "Receipt Maker", url: "receipt-maker.html", icon: "📄", desc: "Create receipts", type: "page" },
            { name: "Receipt Maker Pro", url: "receipt-maker1.html", icon: "📋", desc: "Advanced receipt creation", type: "page" },
            { name: "Receiving Receipt", url: "receiving-receipt.html", icon: "📥", desc: "Receiving receipts", type: "page" },
            { name: "Bank Deposit", url: "bank-deposit.html", icon: "🏦", desc: "Bank deposit tracking", type: "page" },
            { name: "Passbook Maker", url: "passbook-maker.html", icon: "📚", desc: "Generate passbooks", type: "page" },
            { name: "Customer Manager", url: "customer-manager.html", icon: "👥", desc: "Manage customers", type: "page" },
            { name: "Customer Information Form", url: "customer-info-form.html", icon: "📋", desc: "Add new customer complete info", type: "page" },
            { name: "Password Vault", url: "password-vault.html", icon: "🔐", desc: "Secure password storage", type: "page" },
            { name: "Image Text Overlayer", url: "image-text-overlayer.html", icon: "🖼️", desc: "Add text to images", type: "page" },
            { name: "Smart Resizer", url: "smart-resizer.html", icon: "📏", desc: "Resize images", type: "page" },
            { name: "Stealth Cipher", url: "stealth-cipher.html", icon: "🔒", desc: "Encryption & decryption", type: "page" },
            { name: "File Drop", url: "file-drop.html", icon: "📁", desc: "File transfer & management", type: "page" },
            { name: "QR Code Tool", url: "data-tools.html", icon: "📊", desc: "QR Generator, Decoder, Data Tools", type: "page" },
            { name: "Analytics", url: "analytics.html", icon: "📈", desc: "View analytics & reports", type: "page" }
        ];

        const allServices = [
            { name: "Airtel Retailer Bank", url: "https://portal.airtelbank.com/", cat: "BANKING", icon: "🏦" },
            { name: "RTPS Bihar Service", url: "https://serviceonline.bihar.gov.in/", cat: "BIHAR", icon: "🏛️" },
            { name: "Bhulekh Bihar", url: "https://land.bihar.gov.in/", cat: "BIHAR", icon: "🗺️" },
            { name: "UIDAI MyAadhar", url: "https://myaadhaar.uidai.gov.in/", cat: "GOVT", icon: "🆔" },
            { name: "Ration Card (EPOS)", url: "http://epos.bihar.gov.in/", cat: "BIHAR", icon: "🍎" },
            { name: "PAN Card Status", url: "https://tin.tin.nsdl.com/pantan/StatusRelook.html", cat: "BANKING", icon: "💳" },
            { name: "Income Tax e-Filing", url: "https://www.incometax.gov.in/", cat: "GOVT", icon: "📊" },
            { name: "GST Services", url: "https://www.gst.gov.in/", cat: "GOVT", icon: "💰" },
            { name: "Railway Booking", url: "https://www.irctc.co.in/", cat: "GOVT", icon: "🚂" },
            { name: "DigiLocker", url: "https://digilocker.gov.in/", cat: "GOVT", icon: "📂" },
            { name: "NREGA Job Card", url: "https://nrega.nic.in/", cat: "BIHAR", icon: "👷" },
            { name: "Bihar Bhu Naksha", url: "https://bhunaksha.bihar.gov.in/", cat: "BIHAR", icon: "📋" },
            { name: "ICICI Bank iMobile", url: "https://imobile.icicibank.com/", cat: "BANKING", icon: "📱" },
            { name: "SBI Online", url: "https://www.sbi.co.in/", cat: "BANKING", icon: "🏪" },
            { name: "HDFC Bank", url: "https://www.hdfcbank.com/", cat: "BANKING", icon: "💳" },
            { name: "COVID-19 Vaccination", url: "https://www.cowin.gov.in/", cat: "GOVT", icon: "💉" },
            { name: "Passport Services", url: "https://www.passportindia.gov.in/", cat: "GOVT", icon: "🛂" },
            { name: "Voter ID Online", url: "https://www.eci.gov.in/", cat: "GOVT", icon: "🗳️" }
        ];

        function performUniversalSearch(query) {
            const searchTerm = query.toLowerCase().trim();
            
            if (!searchTerm) {
                document.getElementById('search-results-container').innerHTML = '';
                document.getElementById('search-count').textContent = '';
                return;
            }

            const results = [];

            allPages.forEach(page => {
                if (page.name.toLowerCase().includes(searchTerm) ||
                    page.desc.toLowerCase().includes(searchTerm) ||
                    page.url.toLowerCase().includes(searchTerm)) {
                    results.push({
                        ...page,
                        priority: page.name.toLowerCase().startsWith(searchTerm) ? 1 : 2
                    });
                }
            });

            allServices.forEach(service => {
                if (service.name.toLowerCase().includes(searchTerm) ||
                    service.cat.toLowerCase().includes(searchTerm)) {
                    results.push({
                        type: "service",
                        name: service.name,
                        desc: service.cat,
                        icon: service.icon,
                        url: service.url,
                        priority: service.name.toLowerCase().startsWith(searchTerm) ? 1 : 2
                    });
                }
            });

            results.sort((a, b) => a.priority - b.priority);
            displayResults(results, searchTerm);
        }

        function displayResults(results, searchTerm) {
            const container = document.getElementById('search-results-container');
            
            if (results.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="no-results">
                            <div class="no-results-icon">😔</div>
                            <h2>No results found</h2>
                            <p>Try searching for something else or use different keywords</p>
                        </div>
                    </div>
                `;
                document.getElementById('search-count').textContent = 'No results found';
                return;
            }

            let html = '';
            
            results.forEach(result => {
                const typeClass = result.type || 'page';
                const badge = result.desc || 'Link';
                
                html += `
                    <div class="card result-card" onclick="openResult('${result.url}', '${result.type}')">
                        <div class="result-icon">${result.icon}</div>
                        <div class="result-title">${result.name}</div>
                        <div class="result-desc">${badge}</div>
                        <div class="result-badge ${typeClass}">${typeClass.toUpperCase()}</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            document.getElementById('search-count').textContent = `Found ${results.length} result${results.length !== 1 ? 's' : ''}`;
        }

        function openResult(url, type) {
            if (type === 'service') {
                window.open(url, '_blank');
            } else {
                window.location.href = url;
            }
        }

        document.getElementById('universal-search-input').addEventListener('input', (e) => {
            performUniversalSearch(e.target.value);
        });

        document.getElementById('universal-search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const firstCard = document.querySelector('.result-card');
                if (firstCard) firstCard.click();
            }
        });

        // --- Theme Toggle ---
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('theme-btn').innerText = '☀️';
        }

        // --- Mobile Sidebar Toggle ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('mobile-overlay').classList.toggle('active');
        }

        window.onload = function() {
            if(window.innerWidth > 768) {
                const title = document.querySelector('.desktop-title');
                if(title) title.style.display = 'block';
            }
        }
    </script>
</body>
</html>
